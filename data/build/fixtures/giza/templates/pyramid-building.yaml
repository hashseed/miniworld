# Builders raise a pyramid from the ground like a sand castle (docs/spec/giza.md
# sections 4.1 and 11.3, decided by Yang on 2026-10-18): a stonecutter works
# at the quarry, and two carriers bring blocks from the stone pile to the foot
# of the pyramid, set them there and walk back for the next. No ramp, and
# nobody stands on the pyramid. Marks are written for the Great Pyramid
# (stage.fit) and scaled to the pyramid each record builds; +x east, +z
# north, the crew on the south side.
id: pyramid-building
params: { builders: culture }
loop: 120 s
stage:
  radius: 300 m
  fit: 230 m
  marks:
    quarry: [110, -250]
    pile-west: [-20, -240]
    pile-east: [40, -240]
    foot-west: [-35, -135]
    foot-east: [35, -135]
cast:
  stonecutter: { culture: $builders, role: worker, count: 1, at: quarry }
  carrier-west: { culture: $builders, role: worker, count: 1, at: pile-west }
  carrier-east: { culture: $builders, role: worker, count: 1, at: pile-east }
beats:
  - {
      at: 0,
      stonecutter: { work-at: quarry },
      carrier-west: { carry-to: foot-west },
      carrier-east: { carry-to: foot-east },
    }
  - { at: 40, carrier-west: { work-at: foot-west }, carrier-east: { work-at: foot-east } }
  - { at: 70, carrier-west: { cheer: carrier-east }, carrier-east: { cheer: carrier-west } }
  - { at: 76, carrier-west: { walk-to: pile-west }, carrier-east: { walk-to: pile-east } }
  - { at: 110, carrier-west: wait, carrier-east: wait }
