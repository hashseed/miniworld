# Hunters stalk a herd, drive one animal into a trap, bring it down, cut it
# up and carry the meat home (docs/spec/milestone-2.md section 18.6). Used by
# mammoth-hunt; other hunts fill the same parameters. Every group has marks of
# its own so the enlarged figures never overlap (section 5.1).
id: big-game-hunt
params: { hunters: culture, prey: animal }
loop: 60 s
stage:
  radius: 40 m
  marks:
    family-home: [-34, 0]
    scouts-home: [-24, 0]
    left-home: [-26, 12]
    right-home: [-26, -12]
    lookout: [-8, 4]
    herd-home: [22, 10]
    prey-home: [24, -16]
    flank-left: [8, 26]
    flank-right: [8, -30]
    swerve: [10, -4]
    trap: [-6, -8]
    throw-left: [-2, 13]
    throw-right: [-4, -24]
    butcher-left: [-6, 3]
    butcher-right: [-6, -19]
    edge: [30, 24]
cast:
  family: { culture: $hunters, role: gatherer, count: 3, at: family-home }
  scouts: { culture: $hunters, role: hunter, count: 2, at: scouts-home }
  hunters-left: { culture: $hunters, role: hunter, count: 3, at: left-home }
  hunters-right: { culture: $hunters, role: hunter, count: 3, at: right-home }
  prey: { animal: $prey, count: 1, at: prey-home }
  herd: { animal: $prey, count: 2, at: herd-home }
beats:
  - { at: 0, family: { work-at: family-home }, scouts: { walk-to: lookout } }
  - { at: 2, hunters-left: { walk-to: flank-left }, hunters-right: { walk-to: flank-right } }
  - { at: 10, scouts: { point: herd } }
  - { at: 13, scouts: { point: prey } }
  - { at: 15, hunters-left: { run-to: throw-left }, hunters-right: { run-to: throw-right } }
  - { at: 15, prey: { run-to: swerve }, herd: { run-to: edge } }
  - { at: 17, prey: { run-to: trap } }
  - { at: 20, hunters-left: { throw-at: prey }, hunters-right: { throw-at: prey } }
  - { at: 23, hunters-left: { throw-at: prey }, hunters-right: { throw-at: prey } }
  - { at: 24, prey: fall }
  - { at: 25, hunters-left: cheer, hunters-right: cheer, scouts: cheer }
  - { at: 26, herd: { walk-to: herd-home } }
  - { at: 27, scouts: { walk-to: scouts-home } }
  - { at: 29, hunters-left: { work-at: butcher-left }, hunters-right: { work-at: butcher-right } }
  - { at: 31, prey: cut-up }
  - { at: 43, hunters-left: { carry-to: left-home }, hunters-right: { carry-to: right-home } }
  - { at: 50, family: { cheer: hunters-left } }
  - { at: 53, family: { work-at: family-home } }
  - { at: 55, prey: appear }
