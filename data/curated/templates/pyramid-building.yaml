# Two haulers pull a block on a sledge from the quarry up a straight ramp to
# the top of a rising pyramid, where a mason sets it in place, and walk back
# down (docs/spec/giza.md sections 4.1 and 11.3). Marks are written for the
# Great Pyramid (stage.fit) and scaled to the pyramid each record builds; +x
# east, +z north, the ramp on the south side.
id: pyramid-building
params: { builders: culture, stone: prop }
loop: 320 s
stage:
  radius: 500 m
  fit: 230 m
  marks:
    quarry: [70, -440]
    ramp-foot: [0, -408]
    top: [0, 0]
cast:
  haulers: { culture: $builders, role: worker, count: 2, at: quarry }
  sledge: { prop: $stone, count: 1, at: quarry }
  mason: { culture: $builders, role: worker, count: 1, at: top }
beats:
  - { at: 0, mason: { work-at: top } }
  - { at: 0, haulers: { haul: ramp-foot }, sledge: { haul: ramp-foot } }
  - { at: 30, haulers: { haul: top }, sledge: { haul: top } }
  - { at: 175, sledge: fall, haulers: { cheer: mason }, mason: { cheer: haulers } }
  - { at: 180, mason: { work-at: top } }
  - { at: 182, haulers: { walk-to: ramp-foot } }
  - { at: 285, haulers: { walk-to: quarry } }
  - { at: 305, sledge: appear }
