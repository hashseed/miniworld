name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # The fixture dataset stands in for the real data in CI (spec milestone 1, section 2.4).
      - run: npm run build-data -- --fixture --max-level 4
      - run: npx vite build --config app/vite.config.ts && node data/build/check-size.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            perf-report.json
          if-no-files-found: ignore
