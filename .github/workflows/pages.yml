# Publishes the app on GitHub Pages (spec section 11, "Hosting"): every push
# to main builds the full data and the app and deploys dist/.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub Pages compresses on its own and never serves the Brotli copies.
      - run: find dist -name '*.br' -delete
      - uses: actions/configure-pages@v5
      # Packed by hand: upload-pages-artifact leaves out hidden files, and the
      # terrain tiles of a level's first quadrant are named like `.<hash>.bin`.
      - run: tar --dereference --hard-dereference --directory dist -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@v4
